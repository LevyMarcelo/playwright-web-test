name: CI de Automação de Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Execução da pipeline de automação de testes
    runs-on: ubuntu-24.04

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Instalar Chromium e dependências do sistema operacional
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos com TypeScript
        run: npm run typecheck

      - name: Executar testes automatizados
        run: npm test

      - name: Publicar relatório e evidências dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
